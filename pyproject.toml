[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py3dst"
version = "1.3.1"
description = "Python module to read/edit 3DST textures."
readme = "README.md"
authors = [{ name = "STBrian", email = "brichap100@gmail.com" }]
license = "GPL-3.0-or-later"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["3dst"]
dependencies = [
    "numpy >= 1.26.0",
    "pillow >= 10.0.0",
]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/STBrian/py3dst"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"py3dst.py3dst_exp" = [
    "*.dll",
    "*.so"
]

[tool.bumpver]
current_version = "1.3.1"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "Bump version {old_version} -> {new_version}"
commit = true
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = ['current_version = "{version}"','version = "{version}"']
"src/py3dst/__init__.py" = ['^__version__ = "{version}"$']
"src/py3dst/__main__.py" = ['^__version__ = "{version}"$']
